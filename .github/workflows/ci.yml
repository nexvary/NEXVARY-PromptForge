name: Verify, Build Catalog and Deploy
on:
  push:
    branches: [main, dev/catalog-ingestion]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check app.js
          node --check engine.mjs
          node --check search.mjs
          node --check personal.mjs
          node --check server/index.mjs
          node --check scripts/library-builder.mjs
          node --check scripts/build-catalog.mjs
      - name: Unit tests
        run: node --test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare website
        run: |
          mkdir -p dist
          cp index.html app.js engine.mjs search.mjs personal.mjs styles.css icon.svg manifest.webmanifest sw.js dist/
      - name: Build verified CC0 catalog
        run: node scripts/build-catalog.mjs --out dist
      - name: Publish downloadable bundle
        uses: actions/upload-artifact@v4
        with:
          name: promptforge-web-catalog
          path: dist/
          retention-days: 14
      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
